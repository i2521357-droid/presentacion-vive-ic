<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="text-align: center; margin-top: 40px;">
        <a href="index.html" class="btn-primary" style="background-color: var(--dark);"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
    </div>

    <section class="galeria-eventos">
        <h2><i class="fas fa-images"></i> MOMENTOS VIVE IC</h2>

        <div class="grid-fotos">
            <div class="foto-wrapper"><img src="foto1.jpeg" alt="Momento Vive IC 1" class="foto-evento"></div>
            <div class="foto-wrapper"><img src="foto2.jpeg" alt="Momento Vive IC 2" class="foto-evento"></div>
            <div class="foto-wrapper"><img src="foto3.jpeg" alt="Momento Vive IC 3" class="foto-evento"></div>

            <div class="foto-wrapper"><img src="foto5.jpeg" alt="Momento Vive IC 2" class="foto-evento"></div>
            <div class="foto-wrapper"><img src="foto6.jpeg" alt="Momento Vive IC 3" class="foto-evento"></div>
        </div>
    </section>

    <!-- Visor de fotos -->
    <div id="modal-foto" class="modal">
        <span class="cerrar">&times;</span>
        <img class="modal-contenido" id="img-ampliada" alt="Visor de imagen">
    </div>

    <script src="script.js"></script>
